[package]
name = "ian-lint"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ignore = "0.4.34"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
ra-ap-rustc_lexer = "0.185.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
