[package]
name = "ian_framework"
version = "0.1.0"
edition = "2021"

[features]
default = ["logging", "http"]
http = [
    "dep:axum",
    "dep:getrandom",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:subtle",
]
logging = [
    "dep:axum",
    "dep:chrono",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]
auth = [
    "http",
    "dep:argon2",
    "dep:chrono",
    "dep:getrandom",
    "dep:hex",
    "dep:redis",
    "dep:sha2",
    "dep:tokio",
]
gcs = [
    "logging",
    "dep:base64",
    "dep:chrono",
    "dep:futures-util",
    "dep:hex",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "reqwest/form",
    "reqwest/json",
    "reqwest/stream",
    "tokio/fs",
    "tokio/io-util",
]

[dependencies]
argon2 = { version = "0.6.0", optional = true }
axum = { version = "0.8.9", optional = true }
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"], optional = true }
getrandom = { version = "0.4.2", optional = true }
hex = { version = "0.4.3", optional = true }
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
sha2 = { version = "0.11.1", optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.54.0", default-features = false, features = ["rt", "sync", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
