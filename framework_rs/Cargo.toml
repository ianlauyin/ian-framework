[package]
name = "ian_framework"
version = "0.1.0"
edition = "2021"

[features]
auth = [
    "dep:argon2",
    "dep:redis",
    "redis/tokio-rustls-comp",
]
gcp = [
    "dep:base64",
    "reqwest/form",
    "tokio/fs",
]
gcs = [
    "gcp",
    "dep:futures-util",
    "reqwest/json",
    "reqwest/stream",
    "tokio/io-util",
]

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
form_urlencoded = "1.2.2"
getrandom = "0.4.2"
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.0", default-features = false, features = ["macros", "rt", "signal", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

argon2 = { version = "0.6.0", optional = true }
base64 = { version = "0.23.1", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"], optional = true }
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
