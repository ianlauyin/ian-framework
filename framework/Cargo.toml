[package]
name = "ian_framework"
version = "0.1.0"
edition = "2021"

[features]
default = ["logging"]
logging = [
    "dep:axum",
    "dep:chrono",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]
gcs = [
    "logging",
    "dep:base64",
    "dep:chrono",
    "dep:futures-util",
    "dep:hex",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "reqwest/form",
    "reqwest/json",
    "reqwest/stream",
    "tokio/fs",
    "tokio/io-util",
]

[dependencies]
axum = { version = "0.8.9", optional = true }
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"], optional = true }
hex = { version = "0.4.3", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
sha2 = { version = "0.11.1", optional = true }
tokio = { version = "1.54.0", default-features = false, features = ["rt", "sync", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
