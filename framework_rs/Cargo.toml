[package]
name = "ian-framework-rs"
version = "0.1.0"
edition = "2024"

[features]
auth = [
  "dep:argon2",
  "redis",
]
gcp = [
  "dep:google-cloud-gax",
  "dep:google-cloud-secretmanager-v1",
]
gcs = [
  "dep:bytes",
  "dep:futures-util",
  "dep:google-cloud-auth",
  "dep:google-cloud-storage",
  "dep:google-cloud-wkt",
  "gcp",
  "tokio/fs",
]
monitor = ["dep:rustix"]
redis = [
  "dep:redis",
  "redis/tokio-rustls-comp",
]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", default-features = false, features = ["fs", "macros", "rt", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7"] }

argon2 = { version = "0.6", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["async-await", "std"], optional = true }
google-cloud-auth = { version = "1", optional = true }
google-cloud-gax = { version = "1", optional = true }
google-cloud-secretmanager-v1 = { version = "2", optional = true }
google-cloud-storage = { version = "1", optional = true }
google-cloud-wkt = { version = "1", optional = true }
redis = { version = "1", features = ["connection-manager", "tokio-comp"], optional = true }
rustix = { version = "1", features = ["fs"], optional = true }

[dev-dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.4"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
