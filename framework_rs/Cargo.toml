[package]
name = "ian_framework"
version = "0.1.0"
edition = "2021"

[features]
auth = [
  "dep:argon2",
  "redis",
]
redis = [
  "dep:redis",
  "redis/tokio-rustls-comp",
]
gcp = [
  "dep:google-cloud-gax",
  "dep:google-cloud-secretmanager-v1",
]
gcs = [
  "dep:bytes",
  "dep:futures-util",
  "dep:google-cloud-auth",
  "dep:google-cloud-storage",
  "dep:google-cloud-wkt",
  "gcp",
  "tokio/fs",
]
monitor = ["dep:rustix"]

[dependencies]
axum = "*"
chrono = { version = "*", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "*"
hex = "*"
http-body-util = "*"
regex = "*"
reqwest = { version = "*", default-features = false, features = ["rustls"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "*"
subtle = "*"
tokio = { version = "*", default-features = false, features = ["macros", "rt", "signal", "sync", "time"] }
tracing = { version = "*", default-features = false, features = ["std"] }
uuid = { version = "*", features = ["v7"] }

argon2 = { version = "*", optional = true }
bytes = { version = "*", optional = true }
futures-util = { version = "*", default-features = false, features = ["async-await", "std"], optional = true }
redis = { version = "*", features = ["connection-manager", "tokio-comp"], optional = true }
rustix = { version = "*", features = ["fs"], optional = true }
google-cloud-auth = { version = "*", optional = true }
google-cloud-gax = { version = "*", optional = true }
google-cloud-secretmanager-v1 = { version = "*", optional = true }
google-cloud-storage = { version = "*", optional = true }
google-cloud-wkt = { version = "*", optional = true }

[dev-dependencies]
tokio = { version = "*", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "*", features = ["util"] }
